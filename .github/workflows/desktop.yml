name: Desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-build.txt
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python build_desktop.py --check-tag "$RELEASE_TAG"
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Install shared build dependencies
        run: python -m pip install -r requirements-build.txt ruff==0.17.1
      - name: Lint and test the shared sources
        run: |
          python -m ruff check .
          python -m unittest discover -s tests -t . -v
      - name: Build and smoke-test portable and native packages
        run: python build_desktop.py --native
      - name: Upload installers, portable archives, checksums and smoke reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JumpTrack-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            dist/*smoke.json
            build/pyinstaller/**/warn-*.txt
            build/smoke-logs/**
          if-no-files-found: ignore

  release:
    name: Publish public pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: JumpTrack-*
          path: build/release-artifacts
      - name: Verify all packages and publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python publish_release.py
          --artifacts build/release-artifacts
          --output build/release
          --tag "$RELEASE_TAG"
          --repo "$RELEASE_REPOSITORY"
          --publish
